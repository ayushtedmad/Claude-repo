<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 18px; }
    p { font-size: 13px; color: #444; line-height: 1.5; }
    input { width: 100%; padding: 8px; font-size: 13px; box-sizing: border-box; margin: 10px 0; }
    button { padding: 8px 16px; background: #1a73e8; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #saved { font-size: 12px; color: green; margin-left: 8px; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>Screenshot & Translate — Settings</h1>
  <p>
    This extension uses the Google Cloud Translation API. Create a key in the
    <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a>
    (enable "Cloud Translation API" first — it has a free monthly quota), then paste it below.
  </p>
  <input type="password" id="apiKey" placeholder="Google Translate API key" autocomplete="off" />
  <button id="save">Save</button>
  <span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
