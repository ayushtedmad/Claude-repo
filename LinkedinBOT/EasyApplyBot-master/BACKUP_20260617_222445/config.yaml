# Add your LinkedIn email ID and password. WARNING: KEEP THIS OFFLINE ON YOUR PC AND DO NOT COMMIT/UPLOAD.
email: ayush.tedmad@gmail.com
password: REDACTED

# OpenAI API key for answering application questions when no answer can be determined using the information below. WARNING: KEEP THIS OFFLINE AND DO NOT COMMIT/UPLOAD.
openaiApiKey: REDACTED

# Anti-lock default is False to prevent your PC from sleeping to allow bot to run uninterrupted.
# Set it to True if you wish to disable this functionality.
disableAntiLock: False

# Optional: Provide a direct LinkedIn Jobs search URL to navigate to.
# If set, the bot will go directly to this URL instead of building one from positions/locations.
# Leave commented out or empty to use the normal positions + locations search.
# Example: url: "https://www.linkedin.com/jobs/search/?f_AL=true&keywords=Technical+Account+Manager&location=Singapore"
url: "https://www.linkedin.com/jobs/collections/easy-apply/?currentJobId=4420427458&discover=true&discoveryOrigin=JOBS_HOME_EXPANDED_JOB_COLLECTIONS&subscriptionOrigin=JOBS_HOME"

# Set to True if you wish to search for remote jobs only.
remote: False

# Set to True if you wish to search for jobs marked as "under 10 applicants" (default is False).
lessthanTenApplicants: False

# Set to True to sort by date posted, False to sort by relevance
newestPostingsFirst: True

# Set to True or False to suit your preference. Multiple True allowed.
experienceLevel:
 internship: False
 entry: False
 associate: False
 mid-senior level: False
 director: False
 executive: False

# Set to True or False to suit your preference. Multiple True allowed.
jobTypes:
 full-time: False
 contract: False
 part-time: False
 temporary: False
 internship: False
 other: False
 volunteer: False

# Set ONLY one as True to suit your preference.
date:
 all time: True
 month: False
 week: False
 24 hours: False

